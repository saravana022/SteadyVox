[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steadyvox-ml"
version = "0.1.0"
description = "Machine learning pipeline for SteadyVox Parkinson's Disease Voice Screening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "librosa>=0.10.1",
    "praat-parselmouth>=0.4.3",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
