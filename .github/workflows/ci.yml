name: SteadyVox CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ml/requirements.txt

      - name: Run Backend & ML Unit Tests
        run: |
          pytest backend/ -v
          pytest ml/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend Build
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build

  validate-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose files
        run: |
          docker compose -f infra/docker/docker-compose.dev.yml config
          docker compose -f infra/docker/docker-compose.prod.yml config

  deploy-ec2:
    needs: [lint-and-test, validate-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.HAS_SECRET == 'true'
        env:
          HAS_SECRET: ${{ secrets.EC2_HOST != '' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/steadyvox || git clone https://github.com/saravana/SteadyVox.git /opt/steadyvox && cd /opt/steadyvox
            git pull origin main
            docker compose -f infra/docker/docker-compose.prod.yml down
            docker compose -f infra/docker/docker-compose.prod.yml up -d --build
            echo "SteadyVox production stack successfully deployed to AWS EC2."
