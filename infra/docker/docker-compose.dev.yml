services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: steadyvox_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-steadyvox_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (S3-Compatible Object Store)
  minio:
    image: minio/minio:latest
    container_name: steadyvox_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Bucket Auto-Provisioning
  createbuckets:
    image: quay.io/minio/mc:latest
    container_name: steadyvox_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb myminio/${S3_BUCKET_NAME:-steadyvox-audio} || true;
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET_NAME:-steadyvox-audio} || true;
      exit 0;
      "

  # FastAPI Backend
  backend:
    build:
      context: ../../
      dockerfile: backend/Dockerfile
    container_name: steadyvox_backend
    restart: unless-stopped
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-steadyvox_db}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-steadyvox-audio}
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app/backend
      - ../../ml:/app/ml
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # React Frontend (Vite Dev Server)
  frontend:
    image: node:20-alpine
    container_name: steadyvox_frontend
    working_dir: /app
    volumes:
      - ../../frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
